# cargo-deny configuration — run with `cargo deny check`.
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
# Fail on known vulnerabilities and unmaintained/yanked crates in the graph.
yanked = "deny"

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
